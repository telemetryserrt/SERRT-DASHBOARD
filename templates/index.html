<script>
// Hora y fecha en tiempo real, 12h con AM/PM al lado
function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; // si es 0, poner 12
    hours = hours.toString().padStart(2, '0');
    minutes = minutes.toString().padStart(2, '0');

    document.getElementById('hour').innerText = `${hours}:${minutes} ${ampm}`;

    let month = (now.getMonth() + 1).toString().padStart(2, '0');
    let day = now.getDate().toString().padStart(2, '0');
    let year = now.getFullYear();

    document.getElementById('date').innerText = `${month}/${day}/${year}`;
}

// Actualizar cada segundo
setInterval(updateClock, 1000);
updateClock(); // llamada inmediata al cargar
</script>

<!-- ================= LIVE TELEMETRY SCRIPT ================= -->

<script>

const optimalSpeed = 34;

function getDirectColor(speed){

const deviation = Math.abs(speed - optimalSpeed);

if(deviation <= 2){
return 'green';
}
else if(deviation <= 7){
return 'yellow';
}
else{
return 'red';
}

}

function updateTelemetry(){

/* Arduino MPH */

fetch('/arduino_speed')
.then(r=>r.json())
.then(d=>{

const speed=parseInt(d.speed);

const velEl=document.getElementById("velocity");

velEl.innerText=speed;

velEl.style.color=getDirectColor(speed);

});

          // SOC
          fetch('/soc')
            .then(r => r.json())
            .then(d => {
              const soc = parseInt(d.soc);
const socEl = document.getElementById("soc");
const ring = document.querySelector(".battery-ring-red img");

socEl.innerText = soc + "%";

/* Cambiar color del ring según SOC */
const labelEl = document.querySelector(".battery-label");

if(soc <= 20){
  ring.style.filter = "invert(16%) sepia(94%) saturate(7494%) hue-rotate(358deg) brightness(92%) contrast(118%)"; // rojo
  socEl.style.color = "red";
  labelEl.style.color = "red";
} else {
  ring.style.filter = "brightness(0) invert(1)"; // blanco
  socEl.style.color = "white";
  labelEl.style.color = "white";
}
            });
      }

      // 5Hz real-time telemetry
      setInterval(updateTelemetry, 500);

      // Configurar gráfico
      const ctx = document.getElementById('arduinoChart').getContext('2d');
      let speedData = [];
      let labels = [];
      const maxPoints = 50; // cantidad máxima de puntos a mostrar

      const arduinoChart = new Chart(ctx, {
          type: 'line',
          data: {
              labels: labels,
              datasets: [{
                  label: 'Arduino Speed (m/s)',
                  data: speedData,
                  borderColor: 'rgb(0, 255, 204)',
                  backgroundColor: 'rgba(0,255,204,0.2)',
                  tension: 0.3
              }]
          },
          options: {
              animation: { duration: 0 },
              scales: {
                  x: { title: { display: true, text: 'Tiempo' } },
                  y: { min: 0, title: { display: true, text: 'm/s' } }
              }
          }
      });

      function updateChart(speed){
          const now = new Date().toLocaleTimeString();
          labels.push(now);
          speedData.push(speed);
          if(labels.length > maxPoints){
              labels.shift();
              speedData.shift();
          }
          arduinoChart.update();
      }
    </script>
