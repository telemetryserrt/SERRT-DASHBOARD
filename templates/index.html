<!DOCTYPE html>
<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://pyscript.net/releases/2024.1.1/core.css"
    />
    <script
      type="module"
      src="https://pyscript.net/releases/2024.1.1/core.js"
    ></script>

    <link rel="stylesheet" href="static/style.css" />
    <link type="image/png" rel="icon" href="static/images/icon-race-car.png" />

    <!-- ================= ESTILO MODERNO VELOCIDAD ================= -->
    <style>
      /* Velocidad estilo moderno */
      #velocity {
        font-size: 7rem;       /* número más grande */
        font-weight: bold;
        font-family: 'Arial', sans-serif;
        text-align: center;    /* centrado */
        color: green;          /* color inicial */
      }

      .text-wrapper-5 {        /* MPH al lado */
        font-size: 3rem;       /* más grande también */
        margin-left: 0.3rem;
        color: #555;
      }

      .MPH {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .overlap-3 {
        display: flex;
        align-items: baseline;
        justify-content: center;
      }

      /* Ring de batería separado y siempre rojo */
      .battery-ring-red {
        position: absolute; /* mantiene posición sobre la batería */
      }

      .battery-ring-red img {
        fill: red; /* asegura que sea rojo */
      }
    </style>
  </head>
  <body>
    <script src="static/index.js" async></script>

    <!-- ================= DASHBOARD ================= -->
    <div class="BB-dashboard">
      <div class="div">
        <div class="overlap">
          <div class="overlap-group">
            <div class="overlap-2">
              <div class=""> &lt;3</div>
              <div class="top-bar">
                <div class="overlap-group-2">
                  <div class="hour">
                    <div class="text-wrapper">7:30</div>
                  </div>
                  <div class="date">
                    <div class="text-wrapper-2">09/27/2023</div>
                  </div>
                </div>
              </div>
              <div class="dashboard-indicators">
                <img
                  class="low-beam-headlights"
                  src="static/img/low-beam-headlights.svg"
                  style="display: none"
                />
                <div class="lights" style="display: none">
                  <div class="overlap-group-3">
                    <img class="shape" src="static/img/shape-1.svg" />
                    <div class="text-wrapper-3">AUTO</div>
                  </div>
                </div>
                <img
                  class="parking-lights"
                  src="static/img/shape.svg"
                  style="display: none"
                />
              </div>
            </div>

            <!-- ================= SPEED DISPLAY ================= -->
            <div class="MPH">
              <div class="overlap-3">
                <div class="text-wrapper-4" id="velocity">0</div>
                <div class="text-wrapper-5">MPH</div>
                <div class="o-v-bar">
                  <img class="range-bar" src="static/img/range-bar.svg" />
                </div>
              </div>
            </div>

            <div class="right-side-analytics">
              <div class="average-mpkW">
                <div class="overlap-group-4">
                  <div class="element-mpge">100 mpkW</div>
                  <div class="text-wrapper-6">Avg. mpkW</div>
                </div>
                <img class="sun" src="static/img/sun.svg" />
              </div>

              <div class="optimal-velocity">
                <div class="overlap-group-4">
                  <div class="element-optvel"><em>34</em> mph</div>
                  <div class="text-wrapper-6">Optimal Velociy</div>
                </div>
                <img
                  class="speedometer"
                  src="static/img/speedometer-svgrepo-com.svg"
                />
              </div>

              <div class="range">
                <div class="text-wrapper-7">188 mi</div>
                <div class="text-wrapper-8">Range</div>
                <div class="road-icon">
                  <img class="rectangle" src="static/img/rectangle-97.svg" />
                  <img class="rectangle-2" src="static/img/rectangle-98.svg" />
                  <div class="rectangle-3"></div>
                  <div class="rectangle-4"></div>
                  <div class="rectangle-5"></div>
                </div>
              </div>
            </div>

            <img class="left-arrow" src="static/img/left-arrow.svg" />
            <img class="right-arrow" src="static/img/right-arrow.svg" />
          </div>

          <img class="road" src="static/img/road.png" />

          <div class="overlap-4">
            <div class="bottom-left">
              <div class="temperature">
                <p class="element-f">
                  <span class="span">98 </span>
                  <span class="text-wrapper-9">°F</span>
                </p>
              </div>
              <div class="o-v">
                <div class="text-wrapper-10"><em>34</em> mph</div>
              </div>
            </div>

            <!-- ================= BATTERY ================= -->
            <div class="battery-charge">
              <div class="overlap-5">
                <div class="text-wrapper-11">Battery charge</div>
                
                <!-- Ring de batería separado y fijo rojo -->
                <div class="battery-ring-red">
                  <img src="static/img/battery-ring.svg" />
                </div>

                <div class="text-wrapper-12" id="soc"><em>0</em>%</div>
              </div>
              <div class="charge">
                <div class="rectangle-6"></div>
                <div class="rectangle-7"></div>
                <div class="rectangle-8"></div>
                <div class="rectangle-9"></div>
                <div class="rectangle-10"></div>
                <div class="rectangle-11"></div>
                <div class="rectangle-12"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- ================= GEAR ================= -->
        <div class="gear-selection">
          <div class="ready">READY</div>
          <div class="text-wrapper-13" data-gear="R">R</div>
          <div class="text-wrapper-14" data-gear="N">N</div>
          <div class="text-wrapper-15" data-gear="D">D</div>
        </div>

    <!-- ================= LIVE TELEMETRY SCRIPT ================= -->
    <script>
      const optimalSpeed = 34; // velocidad óptima

      function getDirectColor(speed) {
          const deviation = Math.abs(speed - optimalSpeed);

          if (deviation <= 5) {
              return 'green';   // cerca del óptimo
          } else if (deviation <= 10) {
              return 'yellow';  // un poco lejos
          } else {
              return 'red';     // muy lejos
          }
      }

      function updateTelemetry() {
          // Arduino MPH
          fetch('/arduino_speed')
            .then(r => r.json())
            .then(d => {
              const speed = parseInt(d.speed); // número entero
              const velEl = document.getElementById("velocity");
              velEl.innerText = speed;         // muestra MPH
              velEl.style.color = getDirectColor(speed); // color estático según velocidad
            });

          // SOC
          fetch('/soc')
            .then(r => r.json())
            .then(d => {
              document.getElementById("soc").innerHTML = "<em>" + d.soc + "</em>%";
            });
      }

      // 5Hz real-time telemetry
      setInterval(updateTelemetry, 500);

      // Configurar gráfico
      const ctx = document.getElementById('arduinoChart').getContext('2d');
      let speedData = [];
      let labels = [];
      const maxPoints = 50; // cantidad máxima de puntos a mostrar

      const arduinoChart = new Chart(ctx, {
          type: 'line',
          data: {
              labels: labels,
              datasets: [{
                  label: 'Arduino Speed (m/s)',
                  data: speedData,
                  borderColor: 'rgb(0, 255, 204)',
                  backgroundColor: 'rgba(0,255,204,0.2)',
                  tension: 0.3
              }]
          },
          options: {
              animation: { duration: 0 },
              scales: {
                  x: { title: { display: true, text: 'Tiempo' } },
                  y: { min: 0, title: { display: true, text: 'm/s' } }
              }
          }
      });

      function updateChart(speed){
          const now = new Date().toLocaleTimeString();
          labels.push(now);
          speedData.push(speed);
          if(labels.length > maxPoints){
              labels.shift();
              speedData.shift();
          }
          arduinoChart.update();
      }
    </script>
  </body>
</html>
