/* Ring de batería más grande y porcentaje centrado */

gap:12px;

display:none;

.fault-symbol{
width:70px;
height:70px;

}

.fault-text{
font-size:1rem;
font-weight:bold;

}

/* Ring de batería más grande */
.battery-ring-red {
  position: relative;      /* relativo para centrar % y texto */
  width: 250px;            /* más grande */
  height: 250px;
  margin: 0 auto;          /* centrado horizontal */
}

/* Imagen del ring en blanco */
.battery-ring-red img {
  width: 100%;
  height: 100%;
  display: block;
  filter: brightness(0) invert(1); /* blanco */
}

/* Porcentaje centrado dentro del ring */
#soc {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 3rem;
  font-weight: bold;
  color: white;
  text-align: center;
  z-index: 5;
  font-family: 'Arial', sans-serif;
}

/* Texto "Charge" dentro del ring, debajo del % */
.battery-label {
  position: absolute;
  top: 60%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 1.5rem;
  font-weight: bold;
  color: white;
  text-align: center;
  z-index: 5;
  font-family: 'Arial', sans-serif;
}
</style>

<script>
// Hora y fecha en tiempo real, 12h con AM/PM al lado
function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; // si es 0, poner 12
    hours = hours.toString().padStart(2, '0');
    minutes = minutes.toString().padStart(2, '0');

    document.getElementById('hour').innerText = `${hours}:${minutes} ${ampm}`;

    let month = (now.getMonth() + 1).toString().padStart(2, '0');
    let day = now.getDate().toString().padStart(2, '0');
    let year = now.getFullYear();

    document.getElementById('date').innerText = `${month}/${day}/${year}`;
}

// Actualizar cada segundo
setInterval(updateClock, 1000);
updateClock(); // llamada inmediata al cargar
</script>

<!-- ================= LIVE TELEMETRY SCRIPT ================= -->

<script>

const optimalSpeed = 34;

function getDirectColor(speed){

const deviation = Math.abs(speed - optimalSpeed);

if(deviation <= 2){
return 'green';
}
else if(deviation <= 7){
return 'yellow';
}
else{
return 'red';
}
}

function updateFaults(data){

const voltageIcon = document.getElementById("fault-voltage");
const voltageText = document.getElementById("voltage-text");

/* LOW or OVER voltage */

if(data.low_voltage){

voltageIcon.style.display = "flex";
voltageIcon.querySelector("img").style.filter =
"invert(48%) sepia(88%) saturate(1900%) hue-rotate(360deg) brightness(105%) contrast(101%)";
voltageText.innerText = "UNDER";

}
else if(data.over_voltage){

voltageIcon.style.display = "flex";
voltageIcon.querySelector("img").style.filter =
"invert(48%) sepia(88%) saturate(1900%) hue-rotate(360deg) brightness(105%) contrast(101%)";
voltageText.innerText = "OVER";

}
else{

voltageIcon.style.display = "none";

}

const ring = document.querySelector(".battery-ring-red img");

if(data.low_voltage || data.over_voltage){
ring.style.filter =
"invert(48%) sepia(88%) saturate(1900%) hue-rotate(360deg) brightness(105%) contrast(101%)";
}

/* Current */

const currentIcon = document.getElementById("fault-current");

if(data.over_current){
currentIcon.style.display = "flex";
currentIcon.querySelector("img").style.filter =
"invert(48%) sepia(88%) saturate(1900%) hue-rotate(360deg)";
}else{
currentIcon.style.display = "none";
}

/* Temperature */

const tempIcon = document.getElementById("fault-temp");

if(data.over_temp){
tempIcon.style.display = "flex";
tempIcon.querySelector("img").style.filter =
"invert(48%) sepia(88%) saturate(1900%) hue-rotate(360deg)";
}else{
tempIcon.style.display = "none";
}
}

function updateTelemetry(){

/* Arduino MPH */

fetch('/arduino_speed')
.then(r=>r.json())
.then(d=>{

const speed=parseInt(d.speed);

const velEl=document.getElementById("velocity");

velEl.innerText=speed;

velEl.style.color=getDirectColor(speed);

});

         // SOC
fetch('/soc')
.then(r => r.json())
.then(d => {

const soc = parseInt(d.soc);
const socEl = document.getElementById("soc");
const ring = document.querySelector(".battery-ring-red img");
const labelEl = document.querySelector(".battery-label");

socEl.innerText = soc + "%";

/* Cambiar color del ring según SOC */

if(soc <= 20){

ring.style.filter =
"invert(16%) sepia(94%) saturate(7494%) hue-rotate(358deg) brightness(92%) contrast(118%)";

socEl.style.color = "red";
labelEl.style.color = "red";

}else{

ring.style.filter = "brightness(0) invert(1)";
socEl.style.color = "white";
labelEl.style.color = "white";

}

});
 
// FAULTS
fetch('/faults')
.then(r=>r.json())
.then(d=>{
updateFaults(d);
});

}

      // 5Hz real-time telemetry
      setInterval(updateTelemetry, 500);



    </script>
